
[env]
framework = arduino
platform = espressif32
lib_deps = 
	tremaru/iarduino_I2C_Motor@^1.1.6
	tremaru/iarduino_Position_BMX055@^1.2.4

[env:esp32s3-n16r8]
build_flags = 
	-DROBOT_HAS_BMX=0
	-DROBOT_HAS_LIDAR=0
	-DROBOT_HAS_MOTOR_I2C=0
	-DROBOT_HAS_MOTOR_PWM=1
board = esp32s3-n16r8
upload_port = /dev/cu.wchusbserial5A470096281
monitor_port = /dev/cu.wchusbserial5A470096281
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:esp32s3-n16r8-debug]
build_flags = 
	-DROBOT_HAS_BMX=0
	-DROBOT_HAS_LIDAR=0
	-DROBOT_HAS_MOTOR_I2C=0
	-DROBOT_HAS_MOTOR_PWM=1
board = esp32s3-n16r8
upload_port = /dev/cu.wchusbserial5A470096281
monitor_port = /dev/cu.wchusbserial5A470096281
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
build_type = debug
