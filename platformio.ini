
[env]
framework = arduino
platform = espressif32
lib_deps = 
	tremaru/iarduino_Position_BMX055@^1.2.4
	tremaru/iarduino_I2C_Motor@^1.1.6

[env:esp32s3-n16r8]
board = esp32s3-n16r8
upload_port = /dev/cu.wchusbserial5A470096281
monitor_port = /dev/cu.wchusbserial5A470096281
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:esp32s3-n16r8-debug]
board = esp32s3-n16r8
upload_port = /dev/cu.wchusbserial5A470096281
monitor_port = /dev/cu.wchusbserial5A470096281
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
build_type = debug
