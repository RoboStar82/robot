
[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
lib_deps = 
	https://github.com/h2zero/NimBLE-Arduino#2.3.7
	https://github.com/jgromes/RadioLib#7.5.0
	https://github.com/RobTillaart/rotaryDecoder#0.4.1
	https://github.com/tremaru/iarduino_Position_BMX055#1.2.4
extra_scripts = 
	pre:version.py
build_type = release
upload_protocol = esptool
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder

[env:robot_ota]
build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-D NET_HOSTNAME="\"robostar82\""
	-D OTA_PASSWORD="\"\""
	-D BLE_DEVICE_NAME="\"RoboStar82\""
	-D BLE_SECURITY_PASSKEY=
	-D ROBOT_ROLE_CHASSIS=1
	-D ROBOT_HAS_CONTROLLER_LORA=1
	-D ROBOT_HAS_TRANSCEIVER_SERIAL=1
	-D ROBOT_HAS_NAVIGATION_SERIAL=1
	-D ROBOT_HAS_MOTOR_MCPWM=1
	-D ROBOT_HAS_MOTOR_CC_PWM=1
	-D ROBOT_HAS_SERVO_PWM=1
	-D ROBOT_HAS_IMU=1
board = esp32s3-n16r8
upload_protocol = espota
upload_port = robostar82.local
upload_flags = --auth=

[env:robot_usb]
build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-D NET_HOSTNAME="\"robostar82\""
