
[env:esp32s3-n16r8]
framework = arduino
platform = espressif32
board = esp32s3-n16r8
build_type = debug

upload_port = /dev/cu.wchusbserial5A470096281
monitor_port = /dev/cu.wchusbserial5A470096281
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder

lib_deps = 
	tremaru/iarduino_Position_BMX055@^1.2.4
	tremaru/iarduino_I2C_Motor@^1.1.6
