    ${secrets.build_flags}
lib_ignore =
    STM32duino FreeRTOS
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
debug_tool = esp-builtin

[env:robot_esp32s3n16r8_ota]
platform = file://platforms/espressif32
board = generic_esp32s3n16r8
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D NET_HOSTNAME="\"robot_esp32s3n16r8\""
    -D BLE_DEVICE_NAME="\"robot_esp32s3n16r8\""
    ${secrets.build_flags}
lib_ignore =
    STM32duino FreeRTOS
monitor_port = socket://robot_esp32s3n16r8.local:2323
upload_protocol = espota
upload_port = robot_esp32s3n16r8.local
upload_flags =
    ${secrets.upload_flags}

