
[env]
framework = arduino
build_type = release
lib_ldf_mode = chain+
extra_scripts =
    pre:scripts.py
    pre:version.py

[platformio]
build_cache_dir = .pio/build/cache
extra_configs =
    secrets.ini

[env:robot_stm32h743vit6_usb]
platform = file://platforms/ststm32
board = weact_mini_stm32h743vit6
build_flags =
    -D NET_HOSTNAME="\"robot_stm32h743vit6\""
    -D BLE_DEVICE_NAME="\"robot_stm32h743vit6\""
    ${secrets.build_flags}
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
upload_protocol = custom
upload_command = ${platformio.core_dir}/penv/bin/pyocd flash -t STM32H743VITx --base-address 0x08000000 --erase sector --frequency 8000000 --trust-crc $SOURCE
debug_tool = custom
debug_server = ${platformio.packages_dir}/tool-openocd/bin/openocd -f interface/stlink.cfg -f target/stm32h7x.cfg

[env:robot_stm32h743vit6_dbg]
platform = file://platforms/ststm32
board = weact_mini_stm32h743vit6
build_type = debug
build_flags =
    -D NET_HOSTNAME="\"robot_stm32h743vit6\""
    -D BLE_DEVICE_NAME="\"robot_stm32h743vit6\""
    ${secrets.build_flags}
monitor_port = socket://robot_esp32s3n16r8.local:2323
upload_protocol = blackmagic
upload_port = robot_esp32s3n16r8.local:3333
debug_tool = blackmagic
debug_port = robot_esp32s3n16r8.local:3333

[env:robot_stm32h743vit6_ota]
platform = file://platforms/ststm32
board = weact_mini_stm32h743vit6
build_flags =
    -D NET_HOSTNAME="\"robot_stm32h743vit6\""
    -D BLE_DEVICE_NAME="\"robot_stm32h743vit6\""
    ${secrets.build_flags}
monitor_port = socket://robot_esp32s3n16r8.local:2323
upload_protocol = blackmagic
upload_port = robot_esp32s3n16r8.local:3333
debug_tool = blackmagic
debug_port = robot_esp32s3n16r8.local:3333

[env:robot_esp32s3n16r8_usb]
platform = file://platforms/espressif32
board = generic_esp32s3n16r8
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D NET_HOSTNAME="\"robot_esp32s3n16r8\""
    -D BLE_DEVICE_NAME="\"robot_esp32s3n16r8\""
    ${secrets.build_flags}
lib_ignore =
    STM32duino FreeRTOS
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
debug_tool = esp-builtin

[env:robot_esp32s3n16r8_dbg]
platform = file://platforms/espressif32
board = generic_esp32s3n16r8
build_type = debug
build_flags =
