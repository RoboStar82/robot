
[env]
framework = arduino
build_type = release
lib_ldf_mode = chain+
extra_scripts =
    pre:scripts.py
    pre:version.py

[platformio]
build_cache_dir = .pio/build/cache
extra_configs =
    secrets.ini

[env:robot_stm32h743vit6_usb]
platform = file://platforms/ststm32
board = weact_mini_stm32h743vit6
build_flags =
    -D NET_HOSTNAME="\"robot_stm32h743vit6\""
    -D BLE_DEVICE_NAME="\"robot_stm32h743vit6\""
    ${secrets.build_flags}
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0

[env:robot_stm32h743vit6_ota]
platform = file://platforms/ststm32
board = weact_mini_stm32h743vit6
build_flags =
    -D NET_HOSTNAME="\"robot_stm32h743vit6\""
    -D BLE_DEVICE_NAME="\"robot_stm32h743vit6\""
    ${secrets.build_flags}
monitor_port = socket://robot_esp32s3n16r8.local:2323
upload_protocol = serial
upload_port = socket://robot_esp32s3n16r8.local:3233
upload_flags =
    ${secrets.upload_flags}

[env:robot_esp32s3n16r8_usb]
platform = file://platforms/espressif32
board = diymore_esp32s3n16r8
build_flags =
    -D NET_HOSTNAME="\"robot_esp32s3n16r8\""
    -D BLE_DEVICE_NAME="\"robot_esp32s3n16r8\""
    ${secrets.build_flags}
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:robot_esp32s3n16r8_ota]
platform = file://platforms/espressif32
board = diymore_esp32s3n16r8
build_flags =
    -D NET_HOSTNAME="\"robot_esp32s3n16r8\""
    -D BLE_DEVICE_NAME="\"robot_esp32s3n16r8\""
    ${secrets.build_flags}
monitor_port = socket://robot_esp32s3n16r8.local:2323
upload_protocol = espota
upload_port = robot_esp32s3n16r8.local
upload_flags =
    ${secrets.upload_flags}

[env:station_e213_usb]
platform = file://platforms/espressif32
board = heltec_vision_master_e213
build_flags =
    -D NET_HOSTNAME="\"station_e213\""
    -D BLE_DEVICE_NAME="\"station_e213\""
    ${secrets.build_flags}
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:station_e213_ota]
platform = file://platforms/espressif32
board = heltec_vision_master_e213
build_flags =
    -D NET_HOSTNAME="\"station_e213\""
    -D BLE_DEVICE_NAME="\"station_e213\""
    ${secrets.build_flags}
monitor_port = socket://station_e213.local:2323
upload_protocol = espota
upload_port = station_e213.local
upload_flags =
    ${secrets.upload_flags}
